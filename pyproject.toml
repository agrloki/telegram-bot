[project]
name = "telegram-digest-bot"
version = "0.1.0"
description = "Telegram bot that generates weekly discussion digests via OpenRouter."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot==21.4",
    "httpx>=0.27.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

